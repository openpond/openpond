<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/appearance.js"></script>
    <link rel="stylesheet" href="/src/styles/theme.css" />
    <link rel="stylesheet" href="/src/styles/splash/app-splash.css" />
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: var(--surface-page); }
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/openpond-icon.png" />
    <title>OpenPond App</title>
  </head>
  <body>
    <div id="root">
      <main class="app-splash" role="status" aria-label="Loading OpenPond">
        <div class="app-splash-lockup">
          <div class="app-splash-mark">
            <img class="app-splash-logo" src="/openpond-icon.png" alt="OpenPond" />
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
