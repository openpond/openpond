[project]
name = "ponder-sdk"
version = "0.1.2"
description = "Typed native Python access to OpenPond training and learning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1,<1", "jsonschema[format]>=4.23,<5", "rfc8785>=0.1.4,<1", "typing-extensions>=4.12,<5"]
classifiers = ["Typing :: Typed", "Programming Language :: Python :: 3"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "tomli>=2,<3; python_version < '3.11'"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ponder_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src", "examples", "tools", "tests", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
required-version = ">=0.9.11"
