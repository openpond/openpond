packages:
  - apps/*
  - packages/*

strictPeerDependencies: true

# Public SDK dependencies retain registry ranges while development uses matching local packages.
linkWorkspacePackages: true

# Declaration bundling uses the JavaScript compiler API; native TypeScript 7
# supplies a CLI instead. Keep that consumer on the compatible API package.
overrides:
  'dts-bundle-generator>typescript': '5.9.3'

# Trusted first-party release required by the SDK publish chain. Keep this
# exact; do not exempt future Harness versions from the release-age policy.
minimumReleaseAgeExclude:
  - '@openpond/harness@0.2.5 || 0.2.6'
  - '@openpond/evals@0.9.2 || 0.10.10'
  # Verified official security update containing the eMudhra SPKI blocklist.
  - 'electron@43.8.2'
  # Official OTel 3.1 packages verified for the optional SDK exporter.
  - '@opentelemetry/core@3.1.0'
  - '@opentelemetry/resources@3.1.0'
  - '@opentelemetry/sdk-trace@3.1.0'
  - '@ai-sdk/gateway@4.0.138'
  - '@ai-sdk/openai-compatible@3.0.87'
  - '@ai-sdk/provider-utils@5.0.76'
  - '@ai-sdk/provider@4.0.37'
  - ai@7.0.165

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  node-pty: true
  sharp: set this to true or false
