name: Release Ponder SDK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "packages/ponder-sdk/package.json"

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: release-ponder-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve SDK release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      should_release: ${{ steps.release.outputs.should_release }}
      already_published: ${{ steps.release.outputs.already_published }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - id: release
        name: Resolve publish state
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/ponder-sdk/package.json').version")"
          package_name="$(node -p "require('./packages/ponder-sdk/package.json').name")"
          tag="ponder-sdk-v${version}"
          should_publish="true"
          should_release="true"
          already_published="false"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if ! git cat-file -e "${GITHUB_SHA}^:packages/ponder-sdk/package.json"; then
              echo "The first ponder-sdk publication must be bootstrapped manually; see packages/ponder-sdk/README.md."
              should_publish="false"
              should_release="false"
            else
              previous_manifest="$(git show "${GITHUB_SHA}^:packages/ponder-sdk/package.json")"
              previous_name="$(
                node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).name)" \
                  <<<"${previous_manifest}"
              )"
              previous_version="$(
                node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).version)" \
                  <<<"${previous_manifest}"
              )"
              if [[ "${package_name}" == "${previous_name}" && "${version}" == "${previous_version}" ]]; then
                echo "packages/ponder-sdk/package.json has no package name or version change; release will be skipped."
                should_publish="false"
                should_release="false"
              fi
            fi
          fi

          name_state="$(node scripts/npm-publication-state.mjs ponder-sdk)"
          version_state="$(node scripts/npm-publication-state.mjs ponder-sdk "${version}")"
          if [[ "${name_state}" == "absent" ]]; then
            echo "ponder-sdk does not exist yet. Complete the one-time npm bootstrap documented in packages/ponder-sdk/README.md."
            should_publish="false"
            should_release="false"
          elif [[ "${version_state}" == "present" ]]; then
            echo "ponder-sdk@${version} is already published; publication will be skipped."
            should_publish="false"
            already_published="true"
            if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
              echo "${tag} already exists; release creation will also be skipped."
              should_release="false"
            fi
          elif git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "${tag} exists but ponder-sdk@${version} does not. Refusing an ambiguous release." >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "should_publish=${should_publish}"
            echo "should_release=${should_release}"
            echo "already_published=${already_published}"
          } >> "$GITHUB_OUTPUT"

  ci_gate:
    name: Require green CI
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Wait for required CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/wait-for-release-ci.mjs

  publish:
    name: Validate Ponder SDK and publish when bootstrapped
    needs: [meta, ci_gate]
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: "11.13.0"
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Require the exact OpenPond SDK release first
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/ponder-sdk/package.json').version")"
          dependency="$(node -p "require('./packages/ponder-sdk/package.json').dependencies['openpond-sdk']")"
          source_version="$(node -p "require('./packages/sdk/package.json').version")"
          [[ "${version}" == "${dependency}" && "${version}" == "${source_version}" ]]
          for attempt in {1..90}; do
            state="$(node scripts/npm-publication-state.mjs openpond-sdk "${dependency}")"
            if [[ "${state}" == "present" ]]; then
              echo "Exact OpenPond SDK dependency is available."
              exit 0
            fi
            sleep 10
          done
          echo "Exact SDK dependency unavailable; Ponder publication refused." >&2
          exit 1
      - run: node packages/ponder-sdk/scripts/build.mjs
      - run: node packages/ponder-sdk/scripts/check-published-consumer.mjs --registry-dependency --declarations
      - run: npm pack ./packages/ponder-sdk --dry-run --ignore-scripts

      - name: Publish through npm trusted publishing
        if: needs.meta.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          npm install --global npm@11.18.0
          npm publish ./packages/ponder-sdk --access public --ignore-scripts

      - name: Verify the registry release
        if: needs.meta.outputs.should_publish == 'true'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            published="$(node scripts/npm-publication-state.mjs ponder-sdk "${VERSION}")"
            if [[ "${published}" == "present" ]]; then
              echo "Verified ponder-sdk@${VERSION} on npm."
              exit 0
            fi
            echo "Waiting for npm registry propagation (attempt ${attempt}/30)."
            sleep 10
          done
          echo "ponder-sdk@${VERSION} was not visible after publication." >&2
          exit 1

  github_release:
    name: Create SDK tag and GitHub release
    needs: [meta, publish]
    if: >-
      always() &&
      needs.meta.outputs.should_release == 'true' &&
      (needs.publish.result == 'success' ||
      (needs.meta.outputs.already_published == 'true' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Create SDK release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "Ponder SDK v${VERSION}" \
            --generate-notes
