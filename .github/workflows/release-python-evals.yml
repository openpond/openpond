name: Release Python Evals

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "packages/evals/python/pyproject.toml"

permissions:
  contents: read
  checks: read

concurrency:
  group: release-python-evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify openpond-evals
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      should_publish: ${{ steps.package.outputs.should_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Resolve package state
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("packages/evals/python/pyproject.toml", "rb"))["project"]["version"])')"
          should_publish="true"
          if python -c 'import sys, urllib.request; urllib.request.urlopen(f"https://pypi.org/pypi/openpond-evals/{sys.argv[1]}/json", timeout=15)' "${version}" >/dev/null 2>&1; then
            should_publish="false"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${should_publish}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check build pydantic

      - name: Wait for required CI
        if: steps.package.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            check_run="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs" --jq '[.check_runs[] | select(.name == "Checks" and .app.slug == "github-actions")] | sort_by(.started_at) | last // {}')"
            status="$(jq -r '.status // empty' <<<"${check_run}")"
            conclusion="$(jq -r '.conclusion // empty' <<<"${check_run}")"
            url="$(jq -r '.html_url // empty' <<<"${check_run}")"
            if [[ "${status}" == "completed" && "${conclusion}" == "success" ]]; then
              echo "Required CI check passed: ${url}"
              exit 0
            fi
            if [[ "${status}" == "completed" && -n "${conclusion}" ]]; then
              echo "Required CI check concluded ${conclusion}: ${url}" >&2
              exit 1
            fi
            echo "Waiting for required CI on ${RELEASE_SHA} (attempt ${attempt}/60)..."
            sleep 10
          done
          echo "Timed out waiting for required CI on ${RELEASE_SHA}." >&2
          exit 1

      - name: Build distributions
        run: python -m build packages/evals/python

      - name: Verify wheel installation
        run: python -m pip install --force-reinstall packages/evals/python/dist/openpond_evals-${{ steps.package.outputs.version }}-py3-none-any.whl

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: openpond-evals-python-${{ steps.package.outputs.version }}
          path: packages/evals/python/dist/
          if-no-files-found: error

  publish:
    name: Publish openpond-evals
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi-production
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: openpond-evals-python-${{ needs.build.outputs.version }}
          path: dist

      # v1.14.2. This is the commit behind the official release/v1 branch and
      # has a published ghcr.io container image for immutable execution.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
