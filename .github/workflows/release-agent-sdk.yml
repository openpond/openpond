name: Release Agent SDK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "packages/agent-sdk/package.json"

permissions:
  contents: read

concurrency:
  group: release-agent-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: Publish openpond-agent-sdk
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: "11.13.0"
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - run: pnpm run build:contracts
      - run: pnpm --dir packages/connected-apps run build
      - run: pnpm run agent-sdk:check
      - run: npm install --global npm@11.18.0
      - run: npm publish ./packages/agent-sdk --access public --ignore-scripts
