name: Release MCP

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "packages/mcp/package.json"

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: release-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    if: github.ref == 'refs/heads/master'
    name: Resolve MCP release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      should_release: ${{ steps.release.outputs.should_release }}
      already_published: ${{ steps.release.outputs.already_published }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - id: release
        name: Resolve publish state
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/mcp/package.json').version")"
          package_name="$(node -p "require('./packages/mcp/package.json').name")"
          tag="mcp-v${version}"
          should_publish="true"
          should_release="true"
          already_published="false"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if ! git cat-file -e "${GITHUB_SHA}^:packages/mcp/package.json"; then
              echo "The first @openpond/mcp publication must be bootstrapped manually; see packages/mcp/RELEASING.md."
              should_publish="false"
              should_release="false"
            else
              previous_manifest="$(git show "${GITHUB_SHA}^:packages/mcp/package.json")"
              previous_name="$(
                node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).name)" \
                  <<<"${previous_manifest}"
              )"
              previous_version="$(
                node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).version)" \
                  <<<"${previous_manifest}"
              )"
              if [[ "${package_name}" == "${previous_name}" && "${version}" == "${previous_version}" ]]; then
                echo "packages/mcp/package.json has no package name or version change; release will be skipped."
                should_publish="false"
                should_release="false"
              fi
            fi
          fi

          if ! npm view @openpond/mcp name >/dev/null 2>&1; then
            echo "@openpond/mcp does not exist yet. Complete the one-time npm bootstrap documented in packages/mcp/RELEASING.md."
            should_publish="false"
            should_release="false"
          elif npm view "@openpond/mcp@${version}" version >/dev/null 2>&1; then
            echo "@openpond/mcp@${version} is already published; publication will be skipped."
            should_publish="false"
            already_published="true"
            if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
              echo "${tag} already exists; release creation will also be skipped."
              should_release="false"
            fi
          elif git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "${tag} exists but @openpond/mcp@${version} does not. Refusing an ambiguous release." >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "should_publish=${should_publish}"
            echo "should_release=${should_release}"
            echo "already_published=${already_published}"
          } >> "$GITHUB_OUTPUT"

  ci_gate:
    name: Require green CI
    needs: meta
    if: needs.meta.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Wait for required CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/wait-for-release-ci.mjs

  publish:
    name: Publish @openpond/mcp
    needs: [meta, ci_gate]
    if: needs.meta.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: "11.13.0"
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Require the published SDK dependency
        shell: bash
        run: |
          set -euo pipefail
          sdk_range="$(node -p "require('./packages/mcp/package.json').dependencies['openpond-sdk']")"
          for attempt in {1..90}; do
            if npm view "openpond-sdk@${sdk_range}" dist.integrity >/dev/null 2>&1; then
              echo "Required SDK dependency is available on npm."
              exit 0
            fi
            echo "Waiting for SDK publication (attempt ${attempt}/90)."
            sleep 10
          done
          echo "Required SDK release did not become available; refusing to publish an uninstallable MCP package." >&2
          exit 1
      - run: pnpm --dir packages/sdk run build
      - run: pnpm run mcp:publish:check

      - name: Publish through npm trusted publishing
        run: |
          set -euo pipefail
          npm install --global npm@11.18.0
          npm publish ./packages/mcp --access public --ignore-scripts

      - name: Verify registry integrity, provenance and installed consumer
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="$(mktemp -d)"
          trap 'rm -rf "${consumer_dir}"' EXIT
          for attempt in {1..120}; do
            published="$(npm view "@openpond/mcp@${VERSION}" version 2>/dev/null || true)"
            integrity="$(npm view "@openpond/mcp@${VERSION}" dist.integrity 2>/dev/null || true)"
            if [[ "${published}" == "${VERSION}" && "${integrity}" == sha512-* ]]; then
              if npm install --prefix "${consumer_dir}" --ignore-scripts --no-audit --no-fund "@openpond/mcp@${VERSION}" && (cd "${consumer_dir}" && npm audit signatures); then
                sed 's|"../dist/index.js"|"@openpond/mcp"|' packages/mcp/test/protocol-boundary.test.mjs > "${consumer_dir}/protocol-boundary.test.mjs"
                (cd "${consumer_dir}" && node --test protocol-boundary.test.mjs)
                echo "Verified @openpond/mcp@${VERSION} with integrity ${integrity}."
                exit 0
              fi
            fi
            echo "Waiting for npm package and attestation propagation (attempt ${attempt}/120)."
            sleep 10
          done
          echo "@openpond/mcp@${VERSION} was not verifiable after publication." >&2
          exit 1

  github_release:
    name: Create MCP tag and GitHub release
    needs: [meta, publish]
    if: >-
      always() &&
      needs.meta.outputs.should_release == 'true' &&
      (needs.publish.result == 'success' ||
      (needs.meta.outputs.already_published == 'true' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Create MCP release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "OpenPond MCP v${VERSION}" \
            --generate-notes
