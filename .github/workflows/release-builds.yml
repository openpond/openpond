name: Release builds

on:
  workflow_dispatch:
    inputs:
      target:
        description: Release artifact
        required: true
        default: desktop
        type: choice
        options:
          - desktop
          - cli
      channel:
        description: Release channel
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable
      version:
        description: Optional release version, for example 0.1.0 or 0.1.0-nightly.20260511.1
        required: false
        type: string
  schedule:
    - cron: "0 7 * * *"
  push:
    branches:
      - master
    paths:
      - "apps/desktop/package.json"
      - "apps/cli/package.json"

permissions:
  contents: read
  checks: read

concurrency:
  group: release-builds-${{ github.event_name == 'push' && github.sha || format('{0}-{1}-{2}', github.ref, inputs.target || 'desktop', inputs.channel || 'nightly') }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.release.outputs.target }}
      channel: ${{ steps.release.outputs.channel }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_name: ${{ steps.release.outputs.release_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      make_latest: ${{ steps.release.outputs.make_latest }}
      ref: ${{ steps.release.outputs.ref }}
      short_sha: ${{ steps.release.outputs.short_sha }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - id: release
        name: Resolve channel and version
        shell: bash
        env:
          INPUT_TARGET: ${{ github.event.inputs.target }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          target="$(node scripts/release-build-target.mjs)"
          manifest="apps/${target}/package.json"
          short_sha="$(git rev-parse --short HEAD)"
          ref="${GITHUB_SHA}"
          should_release="true"
          raw_version=""

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            channel="nightly"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            channel="${INPUT_CHANNEL:-nightly}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/master" ]]; then
            channel="stable"
            raw_version="$(node -p "require('./${manifest}').version")"
            if ! git cat-file -e "${RELEASE_BEFORE}:${manifest}"; then
              echo "Cannot resolve the previous ${target} version from ${RELEASE_BEFORE}." >&2
              exit 1
            fi
            previous_version="$(
              git show "${RELEASE_BEFORE}:${manifest}" \
                | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).version)"
            )"
            if [[ "${raw_version}" == "${previous_version}" ]]; then
              should_release="false"
            fi
          else
            echo "Unsupported release event: ${GITHUB_EVENT_NAME}" >&2
            exit 1
          fi

          if [[ "${channel}" != "stable" && "${channel}" != "nightly" ]]; then
            echo "Unsupported release channel: ${channel}" >&2
            exit 1
          fi

          if [[ "${channel}" == "stable" ]]; then
            test "${GITHUB_REF}" = "refs/heads/master"
            if [[ -z "${raw_version}" ]]; then
              raw_version="${INPUT_VERSION}"
            fi
            if [[ -z "${raw_version}" ]]; then
              echo "Stable workflow_dispatch releases require the version input." >&2
              exit 1
            fi
            version="${raw_version#v}"
            prerelease="false"
            make_latest="true"
            release_name="OpenPond App v${version}"
          else
            if [[ -n "${INPUT_VERSION}" ]]; then
              version="${INPUT_VERSION#v}"
            else
              base_version="$(node -p "require('./apps/desktop/package.json').version.split('-')[0]")"
              nightly_date="$(date -u +%Y%m%d)"
              version="${base_version}-nightly.${nightly_date}.${GITHUB_RUN_NUMBER}"
            fi
            prerelease="true"
            make_latest="false"
            release_name="OpenPond App Nightly v${version}"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            latest_nightly_tag="$(git tag --sort=-creatordate --list 'v*-nightly.*' | head -n 1)"
            if [[ -n "${latest_nightly_tag}" ]]; then
              latest_nightly_sha="$(git rev-list -n 1 "${latest_nightly_tag}")"
              if [[ "${latest_nightly_sha}" == "${GITHUB_SHA}" ]]; then
                should_release="false"
              fi
            fi
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi

          tag="v${version}"
          if [[ "${target}" == "cli" ]]; then
            tag="cli-v${version}"
            release_name="OpenPond CLI v${version}"
            make_latest="false"
          fi

          if [[ "${channel}" == "stable" && "${should_release}" == "true" ]]; then
            if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
              if [[ "${target}" != "cli" || "$(git rev-list -n 1 "${tag}")" != "${ref}" ]]; then
                echo "Release tag ${tag} already exists on another source or is a Desktop release." >&2
                exit 1
              fi
            fi
            if [[ "${target}" == "cli" ]]; then
              latest_stable_tag="$(git tag --list 'cli-v*' --sort=-version:refname | head -n 1)"
            else
              latest_stable_tag="$(bash scripts/latest-stable-release-tag.sh)"
            fi
            # CLI publisher checks registry latest under its lock for new
            # publication; exact existing-version recovery never touches latest.
            if [[ -n "${latest_stable_tag}" ]]; then
              latest_stable_version="${latest_stable_tag#cli-}"
              latest_stable_version="${latest_stable_version#v}"
              highest_version="$(printf '%s\n%s\n' "${latest_stable_version}" "${version}" | sort -V | tail -n 1)"
              if [[ "${target}" != "cli" && ( "${highest_version}" != "${version}" || "${latest_stable_version}" == "${version}" ) ]]; then
                echo "Stable release ${version} must be newer than ${latest_stable_version}." >&2
                exit 1
              fi
            fi
          fi

          {
            echo "target=${target}"
            echo "channel=${channel}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "release_name=${release_name}"
            echo "prerelease=${prerelease}"
            echo "make_latest=${make_latest}"
            echo "ref=${ref}"
            echo "short_sha=${short_sha}"
            echo "should_release=${should_release}"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        if: steps.release.outputs.channel == 'stable' && steps.release.outputs.should_release == 'true'
        with:
          version: "11.13.0"
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.release.outputs.channel == 'stable' && steps.release.outputs.should_release == 'true'
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Install release metadata dependencies
        if: steps.release.outputs.channel == 'stable' && steps.release.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify stable source version
        if: steps.release.outputs.channel == 'stable' && steps.release.outputs.should_release == 'true'
        run: pnpm run release:version:check --version "${{ steps.release.outputs.version }}" --target "${{ steps.release.outputs.target }}"

  ci_gate:
    name: Require green CI
    needs: meta
    if: needs.meta.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the required CI check on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.meta.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            check_run="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "Checks" and .app.slug == "github-actions")] | sort_by(.started_at) | last // {}')"
            status="$(jq -r '.status // empty' <<<"${check_run}")"
            conclusion="$(jq -r '.conclusion // empty' <<<"${check_run}")"
            url="$(jq -r '.html_url // empty' <<<"${check_run}")"
            if [[ "${status}" == "completed" && "${conclusion}" == "success" ]]; then
              echo "Required CI check passed: ${url}"
              exit 0
            fi
            if [[ "${status}" == "completed" && -n "${conclusion}" ]]; then
              echo "Required CI check concluded ${conclusion}: ${url}" >&2
              exit 1
            fi
            echo "Waiting for required CI check on ${RELEASE_SHA} (attempt ${attempt}/60)."
            sleep 10
          done
          echo "Timed out waiting for the required Checks result on ${RELEASE_SHA}." >&2
          exit 1

  source_artifacts:
    name: Build release source artifacts once
    needs: [meta, ci_gate]
    if: needs.meta.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.meta.outputs.ref }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: "11.13.0"
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Prepare release build config
        if: needs.meta.outputs.target == 'desktop'
        run: pnpm exec tsx scripts/prepare-release.ts --channel "${{ needs.meta.outputs.channel }}" --version "${{ needs.meta.outputs.version }}"

      - if: needs.meta.outputs.target == 'desktop'
        run: pnpm run build:artifacts
      - if: needs.meta.outputs.target == 'cli'
        run: pnpm run bundle:server && pnpm run build:web
      - run: pnpm run cli:build:from-web
      - run: pnpm run cli:distribution:check

      - name: Stage release source artifacts
        run: pnpm run release:source-artifacts:stage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-source-artifacts
          path: release-source-artifacts
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    needs: [meta, source_artifacts]
    if: needs.meta.outputs.target == 'desktop' && needs.meta.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-appimage
            os: ubuntu-24.04
            package_script: package:linux:release
          - name: linux-arm64-appimage
            os: ubuntu-24.04-arm
            package_script: package:linux:release
          - name: mac-arm64-zip
            os: macos-15
            package_script: package:mac:release
          - name: mac-x64-zip
            os: macos-15-intel
            package_script: package:mac:release
          # Temporarily disabled while Windows release builds are unstable.
          # - name: windows-nsis
          #   os: windows-latest
          #   package_script: package:win:release

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.meta.outputs.ref }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: "11.13.0"
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-source-artifacts
          path: .

      - name: Prepare release build config
        run: pnpm exec tsx scripts/prepare-release.ts --channel "${{ needs.meta.outputs.channel }}" --version "${{ needs.meta.outputs.version }}"

      - name: Package non-macOS desktop
        if: runner.os != 'macOS'
        run: pnpm run ${{ matrix.package_script }}

      - name: Sign and notarize macOS desktop
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          for required_name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!required_name:-}" ]]; then
              echo "Required macOS signing secret ${required_name} is not configured." >&2
              exit 1
            fi
          done

          : "${RUNNER_TEMP:?RUNNER_TEMP must be set}"
          export APPLE_API_KEY="${RUNNER_TEMP}/openpond-app-store-connect-api-key.p8"
          trap 'rm -f "${APPLE_API_KEY}"' EXIT
          printf '%s' "${APPLE_API_KEY_P8}" | base64 -D > "${APPLE_API_KEY}"
          chmod 600 "${APPLE_API_KEY}"

          pnpm run "${{ matrix.package_script }}"

      - name: Verify macOS Developer ID signature and notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find release -maxdepth 3 -type d -name '*.app' -print -quit)"
          if [[ -z "${app_path}" ]]; then
            echo "No packaged macOS app was found for signature verification." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${app_path}"
          codesign --display --verbose=2 "${app_path}" 2>&1 | grep -F "Authority=Developer ID Application: Lost Labs LLC (KLX9Q9L86F)"
          xcrun stapler validate "${app_path}"
          spctl --assess --type execute --verbose=4 "${app_path}"

      - name: Verify desktop package integrity and report size
        run: pnpm run desktop:package:check

      - name: Install Linux packaged-smoke display dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Prove renderer commit boundaries in the dev browser harness
        if: matrix.name == 'linux-x64-appimage'
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir -p release-smoke
          xvfb-run -a pnpm run smoke:desktop:dev --skip-chat --json release-smoke/dev-render-commits.json

      - name: Smoke packaged desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-smoke
          report_path="release-smoke/smoke-${{ matrix.name }}.json"
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            xvfb-run -a pnpm run smoke:desktop:packaged --json "${report_path}"
          else
            pnpm run smoke:desktop:packaged --json "${report_path}"
          fi

      - name: Verify Debian package install, upgrade and desktop launch
        if: runner.os == 'Linux'
        shell: bash
        env:
          APT_SMOKE_DESKTOP: "1"
        run: |
          set -euo pipefail
          packages=(release/*.deb)
          [[ "${#packages[@]}" == 1 && -f "${packages[0]}" ]]
          bash scripts/apt/smoke-deb.sh "${packages[0]}"

      - name: Verify Debian 13 package lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e CI=true -v "$PWD:/workspace:ro" -w /workspace debian:13 \
            bash -c 'apt-get update && apt-get install -y --no-install-recommends python3 ca-certificates && bash scripts/apt/smoke-deb.sh release/*.deb'

      - name: Upload packaged smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-smoke-${{ matrix.name }}
          path: release-smoke/**
          if-no-files-found: warn

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          files=(release/*.AppImage release/*.deb release/*.zip release/*.exe release/*.blockmap release/*.yml)
          for index in "${!files[@]}"; do
            if [[ "$(basename "${files[$index]}")" == "builder-debug.yml" ]]; then
              unset 'files[$index]'
            fi
          done
          if (( ${#files[@]} == 0 )); then
            echo "No release assets were produced." >&2
            exit 1
          fi
          cp "${files[@]}" release-publish/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.name }}
          path: release-publish/*
          if-no-files-found: error

  npm_publish:
    name: Publish stable CLI package to npm
    # CLI-only publication keeps the existing npm trusted-publisher identity.
    needs: [meta, source_artifacts]
    if: needs.meta.outputs.should_release == 'true' && needs.meta.outputs.channel == 'stable' && needs.meta.outputs.target == 'cli'
    runs-on: ubuntu-latest
    environment: npm-production
    # One lock across push/manual runs; check registry latest after acquiring it.
    concurrency:
      group: openpond-cli-npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.meta.outputs.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-source-artifacts
          path: .

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish and verify the exact CLI artifact through OIDC
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          RELEASE_SHA: ${{ needs.meta.outputs.ref }}
        run: |
          set -euo pipefail
          npm install --global npm@11.18.0
          node scripts/publish-cli-release.mjs

  cli_release:
    name: Publish CLI GitHub release
    needs: [meta, npm_publish]
    if: needs.meta.outputs.target == 'cli' && needs.npm_publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.meta.outputs.ref }}
          fetch-depth: 0
      - name: Create independent CLI release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          RELEASE_SHA: ${{ needs.meta.outputs.ref }}
          RELEASE_NAME: ${{ needs.meta.outputs.release_name }}
        run: node scripts/publish-cli-github-release.mjs

  release:
    name: Publish GitHub Release
    needs: [meta, build]
    if: >-
      always()
      && needs.meta.outputs.should_release == 'true'
      && needs.build.result == 'success'
      && needs.meta.outputs.target == 'desktop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.meta.outputs.ref }}
          fetch-depth: 0

      - name: Fetch release tags
        run: git fetch --force --tags origin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: packaged-smoke-*
          merge-multiple: true
          path: release-smoke-artifacts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-source-artifacts
          path: .

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: "11.13.0"
          cache: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Validate packaged smoke reports
        run: pnpm run smoke:desktop:packaged:validate --dir release-smoke-artifacts

      - name: Generate SBOM
        run: pnpm run release:sbom

      - name: Generate release inventory
        run: pnpm run release:inventory --release-assets release-assets --channel "${{ needs.meta.outputs.channel }}" --version "${{ needs.meta.outputs.version }}"

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release-assets
          checksum_file="$(mktemp)"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf "%P\0" | sort -z | xargs -0 sha256sum > "${checksum_file}"
          mv "${checksum_file}" SHA256SUMS.txt

      - id: release_notes
        name: Resolve release notes range
        env:
          RELEASE_CHANNEL: ${{ needs.meta.outputs.channel }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail

          if [[ "${RELEASE_CHANNEL}" == "stable" ]]; then
            previous_tag="$(
              git tag --merged HEAD --sort=-v:refname --list 'v[0-9]*.[0-9]*.[0-9]*' \
                | grep -Ev '(-nightly\.|^'"${RELEASE_TAG}"'$)' \
                | head -n 1 \
                || true
            )"
          else
            previous_tag="$(
              git tag --merged HEAD --sort=-creatordate --list 'v*-nightly.*' \
                | grep -v '^'"${RELEASE_TAG}"'$' \
                | head -n 1 \
                || true
            )"
          fi

          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.release_notes.outputs.previous_tag != ''
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ needs.meta.outputs.ref }}
          name: ${{ needs.meta.outputs.release_name }}
          generate_release_notes: true
          previous_tag: ${{ steps.release_notes.outputs.previous_tag }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          make_latest: ${{ needs.meta.outputs.make_latest }}
          files: release-assets/*
          fail_on_unmatched_files: true

      - name: Publish first release
        if: steps.release_notes.outputs.previous_tag == ''
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ needs.meta.outputs.ref }}
          name: ${{ needs.meta.outputs.release_name }}
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.prerelease }}
          make_latest: ${{ needs.meta.outputs.make_latest }}
          files: release-assets/*
          fail_on_unmatched_files: true

  apt:
    name: Publish stable APT packages
    needs: [meta, release]
    if: needs.meta.outputs.channel == 'stable' && vars.APT_ENABLED == 'true'
    uses: ./.github/workflows/publish-apt.yml
    with:
      tag: ${{ needs.meta.outputs.tag }}
    secrets: inherit
